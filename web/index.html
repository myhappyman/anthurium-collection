<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안스리움 컬렉션 — 원종·선별종·하이브리드 정리</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>안스리움 컬렉션</h1>
    <p class="tagline">원종 · 선별종 · 하이브리드를 계보와 약어로 정리합니다</p>
  </header>

  <section class="toolbar">
    <input id="search" type="search" placeholder="이름·학명·태그·약어 검색 (예: 퀸, crystallinum, FSxRL)" autocomplete="off" />
    <div id="type-filters" class="filters"></div>
    <a href="lineage.html" class="graph-open-btn">🗺 계보 캔버스</a>
  </section>

  <main>
    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="empty" class="empty" hidden>일치하는 개체가 없습니다.</p>
  </main>

  <!-- 상세 보기 모달 -->
  <div id="detail" class="detail" hidden>
    <div class="detail-backdrop" data-close></div>
    <article class="detail-card" role="dialog" aria-modal="true">
      <button class="detail-close" data-close aria-label="닫기">×</button>
      <div id="detail-body"></div>
    </article>
  </div>

  <!-- 계보 트리 오버레이 -->
  <div id="tree" class="tree-overlay" hidden>
    <div class="detail-backdrop" data-close-tree></div>
    <div class="tree-card" role="dialog" aria-modal="true">
      <button class="detail-close" data-close-tree aria-label="닫기">×</button>
      <div id="tree-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>데이터: <code>data/taxa.json</code> · "검증 필요" 표시는 사실 확인 전 항목입니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
